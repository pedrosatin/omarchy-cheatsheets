name: Build Binary

on:
  push:
    branches: [build-test]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev libclang-dev cmake lld
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: omarchy-cheatsheets-bin
          path: target/release/omarchy-cheatsheets
